name: iOS CI

# Every push to any branch runs the CI, so a branch has a result from its first push; only
# ci-screenshots (images published by this workflow, no code) is left out. There is no pull_request
# trigger: a pull request shows the result of the push run of its head commit, and main runs again
# on every merge.
on:
  push:
    branches-ignore:
      - ci-screenshots
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  # Never cancel runs on main, so every commit there gets a result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Xcode and simulator are pinned on purpose. Updating them must be a
# deliberate, reviewed change: edit these values, never rely on runner defaults.
env:
  XCODE_PATH: /Applications/Xcode_26.6.app
  XCODE_VERSION: "26.6"
  XCODE_BUILD: 17F113
  SIMULATOR_DESTINATION: "platform=iOS Simulator,arch=arm64,name=iPhone 17,OS=26.5"
  DERIVED_DATA_PATH: build/DerivedData
  # Interface tests (screenshots are exported from this bundle) and unit tests have separate results.
  RESULT_BUNDLE_PATH: build/TestResults.xcresult
  UNIT_RESULT_BUNDLE_PATH: build/UnitTestResults.xcresult

jobs:
  build-and-test:
    name: Build and test (Xcode 26.6, iPhone 17, iOS 26.5)
    runs-on: macos-26
    # The interface tests take most of the run, and green runs last about 40 minutes (42 on main after
    # PR #20). A run that fails also spends up to 5 more minutes collecting the simulator log, and with
    # a 45-minute limit that pushed it over (the first run of S3-B was cancelled that way, before its
    # artifacts were uploaded). 60 minutes leaves room for both as screens are added.
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select and verify pinned Xcode
        run: |
          set -euo pipefail
          sudo xcode-select --switch "$XCODE_PATH"
          version_output="$(xcodebuild -version)"
          echo "$version_output"
          actual_version="$(echo "$version_output" | sed -n '1p')"
          actual_build="$(echo "$version_output" | sed -n '2p')"
          if [ "$actual_version" != "Xcode $XCODE_VERSION" ] || [ "$actual_build" != "Build version $XCODE_BUILD" ]; then
            echo "::error::Expected Xcode $XCODE_VERSION ($XCODE_BUILD) but found: $version_output"
            exit 1
          fi

      - name: Show environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Validate project
        run: |
          set -euo pipefail
          xcodebuild -list -project IronFlow.xcodeproj

      # Timed steps source this helper. It appends to build/diagnostics/steps.txt a "start" line and,
      # when the step's shell exits, an "end" line with the exit code, or with the signal when the step
      # was stopped by one (as when the job is cancelled). A step killed outright leaves only its
      # "start" line. Each line ends with the machine's 1-minute load average ("-" when unavailable).
      # Recording never fails a step.
      - name: Prepare step records
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics
          cat > build/diagnostics/record-step.sh <<'SH'
          step_name="$1"
          step_signal=""
          step_record() {
            local load
            load="$(sysctl -n vm.loadavg 2>/dev/null | awk '{print $2}')" || true
            echo "$* $(date +%s) ${load:--}" >> build/diagnostics/steps.txt || true
          }
          step_end() {
            local status=$?
            if [ -n "$step_signal" ]; then
              step_record end "$step_name" "signal=$step_signal"
            else
              step_record end "$step_name" "exit=$status"
            fi
          }
          trap 'step_signal=INT; exit 130' INT
          trap 'step_signal=TERM; exit 143' TERM
          trap step_end EXIT
          step_record start "$step_name"
          SH

      - name: Build for testing
        id: build_for_testing
        run: |
          set -euo pipefail
          source build/diagnostics/record-step.sh build_for_testing || true
          xcodebuild build-for-testing \
            -project IronFlow.xcodeproj \
            -scheme IronFlow \
            -configuration Debug \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/build.log

      # The simulator boots only after the build, in its own step, so each one is measured alone: in
      # run 38645463404, with both at once, the build was much slower (the cause is not proven). The
      # tests run on this one device, by its UDID, once it has completely booted.
      - name: Boot simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list runtimes --json > build/diagnostics/runtimes.json
          xcrun simctl list devices available --json > build/diagnostics/devices.json
          # The device named by SIMULATOR_DESTINATION (name and OS); exactly one must exist.
          python3 - <<'PY'
          import json, os, sys
          fields = dict(part.split("=", 1) for part in os.environ["SIMULATOR_DESTINATION"].split(","))
          name, version = fields["name"], fields["OS"]
          with open("build/diagnostics/runtimes.json") as f:
              runtimes = [
                  runtime for runtime in json.load(f)["runtimes"]
                  if runtime.get("isAvailable") and runtime.get("version") == version
                  and (runtime.get("platform") == "iOS" or runtime.get("name", "").startswith("iOS "))
              ]
          with open("build/diagnostics/devices.json") as f:
              devices = json.load(f)["devices"]
          matches = [
              (runtime, device)
              for runtime in runtimes
              for device in devices.get(runtime["identifier"], [])
              if device.get("name") == name
          ]
          if len(matches) != 1:
              print(f"::error::Expected exactly one available {name} with iOS {version}, found {len(matches)}.")
              for runtime, device in matches:
                  print(f"  {device.get('udid')} {runtime.get('identifier')}")
              sys.exit(1)
          runtime, device = matches[0]
          simulator = {
              "name": device["name"],
              "udid": device["udid"],
              "state": device.get("state"),
              "runtime": {key: runtime.get(key) for key in ("identifier", "name", "version", "buildversion")},
          }
          with open("build/diagnostics/simulator.json", "w") as f:
              json.dump(simulator, f, indent=2)
          print(json.dumps(simulator, indent=2))
          PY
          udid="$(python3 -c 'import json; print(json.load(open("build/diagnostics/simulator.json"))["udid"])')"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          # Only the boot is timed: from here until the simulator has completely booted.
          source build/diagnostics/record-step.sh simulator_boot || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices booted | tee build/diagnostics/booted-devices.txt

      # Every test target of the scheme except the interface tests.
      - name: Run unit tests
        id: unit_tests
        run: |
          set -euo pipefail
          source build/diagnostics/record-step.sh unit_tests || true
          xcodebuild test-without-building \
            -project IronFlow.xcodeproj \
            -scheme IronFlow \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$UNIT_RESULT_BUNDLE_PATH" \
            -skip-testing:IronFlowUITests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/unit-test.log

      # Runs even when the unit tests fail, so the results of both are always reported; each step
      # keeps its own exit code, and the job fails if either fails.
      - name: Run UI tests
        id: ui_tests
        if: ${{ !cancelled() && steps.build_for_testing.outcome == 'success' && steps.simulator.outcome == 'success' }}
        run: |
          set -euo pipefail
          source build/diagnostics/record-step.sh ui_tests || true
          xcodebuild test-without-building \
            -project IronFlow.xcodeproj \
            -scheme IronFlow \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            -only-testing:IronFlowUITests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/ui-test.log

      # When tests fail, the simulator's system log of the run is kept with the build logs.
      # Bounded so this optional diagnostic cannot use up the job's time; it never replaces the test failure.
      - name: Collect simulator log
        if: ${{ !cancelled() && (steps.unit_tests.outcome == 'failure' || steps.ui_tests.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 45m --style compact \
            > build/diagnostics/simulator-system.log 2>&1
          ls -la build/diagnostics/simulator-system.log

      # Release is compiled, not tested again: the tests above cover the behavior, and this proves the
      # optimized build without the Debug-only test hooks still compiles, for the iPhone SDK the App
      # Store build uses (one architecture, no signing). Runs even when tests fail, so both are reported.
      - name: Build Release
        id: build_release
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          source build/diagnostics/record-step.sh build_release || true
          xcodebuild build \
            -project IronFlow.xcodeproj \
            -scheme IronFlow \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/build-release.log

      # The app is dark only, and the Release build must not carry the Debug-only test hooks. Neither is
      # covered by the tests (they run the Debug build), so the Release app is checked here: its
      # Info.plist must say Dark, and the text of its executable must not hold what only the hooks
      # contain. The hook arguments themselves (-ui-testing, -ui-seed) are too short to be found as text
      # (Swift keeps strings of up to 15 bytes inside the code), so longer text that exists only with
      # them is searched instead, and the same text must be found in the Debug app, or the search would
      # prove nothing.
      - name: Verify Release build
        id: verify_release
        if: ${{ !cancelled() && steps.build_release.outcome == 'success' }}
        run: |
          set -euo pipefail
          debug_app="$DERIVED_DATA_PATH/Build/Products/Debug-iphonesimulator/IronFlow.app"
          release_app="$DERIVED_DATA_PATH/Build/Products/Release-iphoneos/IronFlow.app"
          for app in "$debug_app" "$release_app"; do
            if [ ! -d "$app" ]; then
              echo "::error::App not found at $app"
              exit 1
            fi
          done

          style="$(plutil -extract UIUserInterfaceStyle raw "$release_app/Info.plist")"
          echo "UIUserInterfaceStyle in the Release Info.plist: $style"
          if [ "$style" != "Dark" ]; then
            echo "::error::Expected UIUserInterfaceStyle Dark in the Release Info.plist, found: $style"
            exit 1
          fi

          # All the text of every executable in an app (the Debug app keeps its code in a .dylib too).
          dump_text() {
            : > "$2"
            for file in "$1"/*; do
              if [ -f "$file" ]; then
                case "$(file -b "$file")" in
                  *Mach-O*) strings -a "$file" >> "$2" ;;
                esac
              fi
            done
          }
          dump_text "$debug_app" build/diagnostics/debug-app-text.txt
          dump_text "$release_app" build/diagnostics/release-app-text.txt

          failed=0
          {
            echo "## Verificação do Release"
            echo
            echo "- UIUserInterfaceStyle no Info.plist do Release: \`$style\`"
            echo
            echo "| Texto que só existe com os ganchos de teste | No Debug (controle) | No Release |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for marker in "-simulate-persistence-failure" "com.ironflow.app.ui-testing" "UI test seed failed" "UITestSeed"; do
            in_debug=não
            in_release=não
            if grep -qF -- "$marker" build/diagnostics/debug-app-text.txt; then in_debug=sim; fi
            if grep -qF -- "$marker" build/diagnostics/release-app-text.txt; then in_release=sim; fi
            echo "| \`$marker\` | $in_debug | $in_release |" >> "$GITHUB_STEP_SUMMARY"
            echo "$marker: Debug=$in_debug Release=$in_release"
            if [ "$in_release" = sim ]; then
              echo "::error::Test hook text '$marker' found in the Release app"
              failed=1
            fi
            if [ "$in_debug" = não ]; then
              echo "::warning::'$marker' was not found in the Debug app, so its absence from Release proves nothing"
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "The Release app is dark only and holds none of the test hooks."

      # Warnings are reported, not treated as errors: they must be reviewed by hand.
      - name: Summarize build warnings
        if: always()
        run: |
          set -euo pipefail
          logs=()
          for log in build/build.log build/unit-test.log build/ui-test.log build/build-release.log; do
            if [ -f "$log" ]; then logs+=("$log"); fi
          done
          if [ "${#logs[@]}" -eq 0 ]; then
            echo "No build log found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Compiler, build-system and build-tool diagnostics are printed as "warning: ...".
          warnings="$(grep -hE '(^|[]:] )warning: ' "${logs[@]}" | sort -u || true)"
          count="$(printf '%s' "$warnings" | grep -c . || true)"
          {
            echo "## Build warnings: $count"
            if [ "$count" -gt 0 ]; then
              echo
              echo '```'
              echo "$warnings"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export screenshots
        if: always()
        run: |
          set -euo pipefail
          if [ ! -d "$RESULT_BUNDLE_PATH" ]; then
            echo "No result bundle found; skipping screenshot export."
            exit 0
          fi
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments \
            --path "$RESULT_BUNDLE_PATH" \
            --output-path build/screenshots
          # Give exported files their readable attachment names when the manifest provides them.
          # Name clashes get a numeric suffix (never overwrite) and the manifest is kept in sync.
          python3 - <<'PY'
          import json, os
          # Characters upload-artifact rejects in file names (failure attachments are named like
          # 'Debug description for `"Push" NavigationBar`'), plus the path separators.
          invalid = '":<>|*?\r\n/\\'
          folder = "build/screenshots"
          manifest_path = os.path.join(folder, "manifest.json")
          if not os.path.exists(manifest_path):
              print("No manifest.json; keeping exported file names.")
              raise SystemExit(0)
          with open(manifest_path) as f:
              manifest = json.load(f)
          for test in manifest:
              for attachment in test.get("attachments", []):
                  exported = attachment.get("exportedFileName")
                  readable = attachment.get("suggestedHumanReadableName")
                  if not exported or not readable:
                      continue
                  readable = "".join("_" if c in invalid else c for c in readable)
                  source = os.path.join(folder, exported)
                  if not os.path.exists(source):
                      print(f"Missing exported file: {exported}")
                      continue
                  # Suggested names may lack the file extension (e.g. "1-tab.home_0_<id>.root").
                  extension = os.path.splitext(exported)[1]
                  if extension and not readable.endswith(extension):
                      readable += extension
                  stem, ext = os.path.splitext(readable)
                  target, n = readable, 2
                  while os.path.exists(os.path.join(folder, target)):
                      target, n = f"{stem}-{n}{ext}", n + 1
                  os.rename(source, os.path.join(folder, target))
                  attachment["exportedFileName"] = target
          with open(manifest_path, "w") as f:
              json.dump(manifest, f, indent=2)
          PY
          ls -la build/screenshots

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs
          path: |
            build/*.log
            build/diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            ${{ env.UNIT_RESULT_BUNDLE_PATH }}
            ${{ env.RESULT_BUNDLE_PATH }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: warn
          retention-days: 7

      # Diagnostics of this run, printed last so they close the log, and added to the run summary.
      # They only read what earlier steps left: anything missing is reported as unavailable, and
      # this step never changes the result of the job.
      - name: Report CI diagnostics
        if: always()
        continue-on-error: true
        env:
          BUILD_OUTCOME: ${{ steps.build_for_testing.outcome }}
          SIMULATOR_OUTCOME: ${{ steps.simulator.outcome }}
          UNIT_OUTCOME: ${{ steps.unit_tests.outcome }}
          UI_OUTCOME: ${{ steps.ui_tests.outcome }}
          RELEASE_OUTCOME: ${{ steps.build_release.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, re, statistics, subprocess
          from datetime import datetime

          UNAVAILABLE = "indisponível"
          lines = []

          def add(text=""):
              lines.append(text)

          def read_text(path):
              try:
                  with open(path, errors="replace") as f:
                      return f.read()
              except OSError:
                  return None

          def read_json(path):
              text = read_text(path)
              try:
                  return json.loads(text) if text else None
              except ValueError:
                  return None

          def command(*args):
              try:
                  result = subprocess.run(args, capture_output=True, text=True, timeout=60)
              except (OSError, subprocess.SubprocessError):
                  return None
              output = result.stdout.strip()
              return output if result.returncode == 0 and output else None

          def seconds(value):
              return UNAVAILABLE if value is None else f"{value:.1f} s"

          def table(header, rows):
              add("| " + " | ".join(header) + " |")
              add("|" + "---|" * len(header))
              for row in rows:
                  add("| " + " | ".join(str(cell).replace("|", "\\|").replace("\n", " ") for cell in row) + " |")

          def section(title, build):
              # Sections are independent: one that cannot be produced is reported, the others still are.
              add()
              add(f"### {title}")
              add()
              try:
                  build()
              except Exception as error:
                  add(f"{UNAVAILABLE} (falha ao gerar esta seção: {type(error).__name__}: {error})")

          def last_match(pattern, text):
              matches = re.findall(pattern, text or "")
              return matches[-1] if matches else None

          # Lines written by record-step.sh: "start NAME EPOCH LOAD" and "end NAME exit=N|signal=SIG EPOCH LOAD".
          RECORDS = {}
          for line in (read_text("build/diagnostics/steps.txt") or "").splitlines():
              parts = line.split()
              if len(parts) == 4 and parts[0] == "start" and parts[2].isdigit():
                  RECORDS.setdefault(parts[1], {})["start"] = (int(parts[2]), parts[3])
              elif len(parts) == 5 and parts[0] == "end" and parts[3].isdigit():
                  RECORDS.setdefault(parts[1], {})["end"] = (parts[2], int(parts[3]), parts[4])

          def duration(name):
              record = RECORDS.get(name, {})
              if "start" in record and "end" in record:
                  return record["end"][1] - record["start"][0]
              return None

          def recorded(name):
              # What the step's own shell recorded; GitHub's result for the step is shown beside it.
              record = RECORDS.get(name, {})
              if "start" not in record:
                  return "sem registro"
              if "end" not in record:
                  return "interrompida, sem registro de fim"
              status = record["end"][0]
              if status == "exit=0":
                  return "concluída (código 0)"
              if status.startswith("exit="):
                  return f"falhou (código {status[5:]})"
              if status.startswith("signal="):
                  return f"encerrada pelo sinal {status[7:]}"
              return f"{UNAVAILABLE} ({status})"

          def load(name):
              record = RECORDS.get(name, {})
              start = record["start"][1] if "start" in record else "-"
              end = record["end"][2] if "end" in record else "-"
              if start == "-" and end == "-":
                  return UNAVAILABLE
              return f"{start} → {end}"

          def environment():
              image = " ".join(v for v in (os.environ.get("ImageOS"), os.environ.get("ImageVersion")) if v)
              runner = " ".join(v for v in (os.environ.get("RUNNER_NAME"), os.environ.get("RUNNER_OS"), os.environ.get("RUNNER_ARCH")) if v)
              macos, macos_build = command("sw_vers", "-productVersion"), command("sw_vers", "-buildVersion")
              xcode = command("xcodebuild", "-version")
              cpu = command("sysctl", "-n", "machdep.cpu.brand_string")
              physical, logical = command("sysctl", "-n", "hw.physicalcpu"), command("sysctl", "-n", "hw.logicalcpu")
              memory = command("sysctl", "-n", "hw.memsize")
              rows = [
                  ("Imagem do runner", image or UNAVAILABLE),
                  ("Runner", runner or UNAVAILABLE),
                  ("macOS", f"{macos} ({macos_build})" if macos else UNAVAILABLE),
                  ("Xcode", xcode.replace("\n", ", ") if xcode else UNAVAILABLE),
                  ("CPU", cpu or UNAVAILABLE),
                  ("Núcleos (físicos / lógicos)", f"{physical or UNAVAILABLE} / {logical or UNAVAILABLE}"),
                  ("Memória", f"{int(memory) / 2**30:.1f} GB" if memory and memory.isdigit() else UNAVAILABLE),
              ]
              simulator = read_json("build/diagnostics/simulator.json")
              if simulator:
                  runtime = simulator.get("runtime") or {}
                  rows += [
                      ("Simulador", f"{simulator.get('name')} ({simulator.get('udid')})"),
                      ("Runtime", f"{runtime.get('name')} ({runtime.get('buildversion')})"),
                  ]
              else:
                  rows.append(("Simulador", UNAVAILABLE))
              table(["Item", "Valor"], rows)

          def steps():
              rows = []
              previous_end = None
              for key, label, outcome in (
                  ("build_for_testing", "Compilação para testes", "BUILD_OUTCOME"),
                  ("simulator_boot", "Boot do simulador", "SIMULATOR_OUTCOME"),
                  ("unit_tests", "Testes de unidade", "UNIT_OUTCOME"),
                  ("ui_tests", "Testes de interface", "UI_OUTCOME"),
                  ("build_release", "Compilação Release", "RELEASE_OUTCOME"),
              ):
                  record = RECORDS.get(key, {})
                  start = record["start"][0] if "start" in record else None
                  gap = seconds(start - previous_end) if start is not None and previous_end is not None else "—"
                  rows.append((label, os.environ.get(outcome) or UNAVAILABLE, recorded(key), seconds(duration(key)), load(key), gap))
                  if "end" in record:
                      previous_end = record["end"][1]
              table(["Etapa", "Resultado no GitHub", "Registro da etapa", "Duração", "Carga de 1 min (início → fim)", "Intervalo desde a etapa anterior"], rows)

          def boot():
              simulator = read_json("build/diagnostics/simulator.json") or {}
              rows = [
                  ("Estado antes do boot", simulator.get("state") or UNAVAILABLE),
                  ("Duração do boot (até o simulador ficar pronto)", seconds(duration("simulator_boot"))),
                  ("Registro", recorded("simulator_boot")),
              ]
              booted = read_text("build/diagnostics/booted-devices.txt")
              if booted is None:
                  rows.append(("Simuladores ligados antes dos testes", UNAVAILABLE))
              else:
                  devices = [line.strip() for line in booted.splitlines() if "(Booted)" in line]
                  rows.append(("Simuladores ligados antes dos testes", f"{len(devices)}: " + "; ".join(devices)))
              table(["Medida", "Valor"], rows)

          RESULT = r"\*\* (TEST [A-Z ]+?) \*\*"
          EXECUTED = r"Executed (\d+) tests?, with (\d+) failures? \((\d+) unexpected\) in ([\d.]+)"

          def classify(message):
              lowered = message.lower()
              if "failed to launch" in lowered or "timed out while launching" in lowered:
                  return "abertura do app"
              if "failed to synthesize event" in lowered or "keyboard focus" in lowered:
                  return "interação com a interface"
              if "crash" in lowered:
                  return "app encerrado inesperadamente"
              if "xctassert" in lowered or "expectation failed" in lowered:
                  return "verificação do teste"
              return "sem padrão conhecido"

          # Test failures only ("File.swift:12: error: …" and Swift Testing "✘ Test …" issues), not the
          # app's own error logs, which some tests cause on purpose.
          FAILURE = re.compile(r"\.swift:\d+(?::\d+)?: error: |^\s*✘ Test (?!run with)")

          def failures(log):
              found = [line.strip() for line in log.splitlines() if FAILURE.search(line)]
              if not found:
                  return
              add()
              add(f"Falhas registradas no log ({len(found)}; pré-classificação apenas pelo texto da mensagem):")
              add()
              for line in found[:30]:
                  add(f"- [{classify(line)}] `{line[:400]}`")
              if len(found) > 30:
                  add(f"- … mais {len(found) - 30} linhas no log completo.")

          def unit_tests():
              log = read_text("build/unit-test.log")
              if log is None:
                  add(f"{UNAVAILABLE} (sem log: a etapa não foi executada)")
                  return
              swift = last_match(r"Test run with (\d+) tests? in (\d+) suites? (passed|failed) after ([\d.]+) seconds(?: with (\d+) issues?)?", log)
              xctest = last_match(EXECUTED, log)
              result = last_match(RESULT, log)
              table(["Medida", "Valor"], [
                  ("Swift Testing", f"{swift[0]} testes em {swift[1]} suítes, {swift[2]}, {float(swift[3]):.1f} s, {swift[4] or 0} problemas" if swift else UNAVAILABLE),
                  ("XCTest", f"{xctest[0]} testes, {xctest[1]} falhas" if xctest else UNAVAILABLE),
                  ("Resultado do xcodebuild", result or UNAVAILABLE),
              ])
              failures(log)

          CASE = re.compile(r"Test Case '-\[(\w+)\.(\w+) (\w+)\]' (started|passed|failed|skipped)(?: \(([\d.]+) seconds\))?")
          ACTIVITY = re.compile(r"^\s*t =\s+([\d.]+)s\s+(.*?)\s*$")

          def parse_cases(log):
              cases, current = [], None
              for line in log.splitlines():
                  match = CASE.search(line)
                  if match:
                      if match.group(4) == "started":
                          current = {"suite": match.group(2), "test": match.group(3), "result": None, "duration": None, "activities": []}
                          cases.append(current)
                      elif current is not None and current["test"] == match.group(3):
                          current["result"] = match.group(4)
                          current["duration"] = float(match.group(5)) if match.group(5) else None
                      continue
                  activity = ACTIVITY.match(line)
                  if activity and current is not None and current["result"] is None:
                      current["activities"].append((float(activity.group(1)), activity.group(2)))
              return cases

          def first_at(activities, matches, after=None):
              for time, text in activities:
                  if (after is None or time >= after) and matches(text):
                      return time
              return None

          def launch_metrics(case):
              # XCTest activity times: the app launch and the automation session appear together,
              # from "Launch" to "Setting up automation session"; the log does not separate them.
              activities = case["activities"]
              launch = first_at(activities, lambda text: text.startswith("Launch "))
              automation = first_at(activities, lambda text: text == "Setting up automation session", launch) if launch is not None else None
              idle = first_at(activities, lambda text: text.startswith("Wait for ") and text.endswith(" to idle"), automation) if automation is not None else None
              pause, during, after = None, None, None
              for (time, text), (next_time, next_text) in zip(activities, activities[1:]):
                  if pause is None or next_time - time > pause:
                      pause, during, after = next_time - time, text, next_text
              return {
                  "setup": first_at(activities, lambda text: text == "Set Up"),
                  "launched": launch is not None,
                  "launch": automation - launch if automation is not None else None,
                  "idle": idle - automation if idle is not None else None,
                  "pause": pause,
                  "during": during,
                  "after": after,
              }

          def launch_text(metrics):
              if not metrics["launched"]:
                  return "sem abertura"
              return seconds(metrics["launch"]) if metrics["launch"] is not None else "não concluída"

          def pause_text(metrics):
              if metrics["pause"] is None:
                  return UNAVAILABLE
              return f"{seconds(metrics['pause'])} em “{metrics['during'][:80]}”, antes de “{metrics['after'][:80]}”"

          def runner_startup(log):
              # From the start of the step to the first interface test (the test runner starting up).
              started = last_match(r"Test Suite 'All tests' started at (\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+)", log)
              record = RECORDS.get("ui_tests", {})
              if not started or "start" not in record:
                  return UNAVAILABLE
              return seconds(datetime.strptime(started, "%Y-%m-%d %H:%M:%S.%f").timestamp() - record["start"][0])

          def ui_tests():
              log = read_text("build/ui-test.log")
              if log is None:
                  add(f"{UNAVAILABLE} (sem log: a etapa não foi executada)")
                  return
              cases = parse_cases(log)
              executed = last_match(EXECUTED, log)
              counted = {result: sum(case["result"] == result for case in cases) for result in ("passed", "failed", "skipped", None)}
              table(["Medida", "Valor"], [
                  ("Testes executados (XCTest)", f"{executed[0]} testes, {executed[1]} falhas ({executed[2]} inesperadas), {float(executed[3]):.1f} s" if executed else UNAVAILABLE),
                  ("Casos no log", f"{len(cases)}: {counted['passed']} passaram, {counted['failed']} falharam, {counted['skipped']} ignorados, {counted[None]} sem resultado"),
                  ("Resultado do xcodebuild", last_match(RESULT, log) or UNAVAILABLE),
                  ("Do início da etapa ao primeiro teste", runner_startup(log)),
              ])
              if cases:
                  measured = [(case, launch_metrics(case)) for case in cases]
                  first_case, first = measured[0]
                  add()
                  add(f"Primeiro teste: `{first_case['suite']}.{first_case['test']}`")
                  add()
                  table(["Medida", "Valor"], [
                      ("Do início do teste ao Set Up", seconds(first["setup"])),
                      ("Da abertura do app à automação pronta", launch_text(first)),
                      ("Da automação pronta ao app ocioso", seconds(first["idle"])),
                      ("Maior pausa entre atividades", pause_text(first)),
                  ])
                  others = [(case, metrics) for case, metrics in measured[1:] if metrics["launch"] is not None]
                  if others:
                      slowest_case, slowest = max(others, key=lambda item: item[1]["launch"])
                      median = statistics.median(metrics["launch"] for _, metrics in others)
                      add()
                      add(f"Demais testes, da abertura do app à automação pronta ({len(others)} com dados): "
                          f"mediana {seconds(median)}, máximo {seconds(slowest['launch'])} em `{slowest_case['suite']}.{slowest_case['test']}`.")
                  suites = {}
                  for case in cases:
                      totals = suites.setdefault(case["suite"], [0, 0, 0.0])
                      totals[0] += 1
                      totals[1] += case["result"] == "failed"
                      totals[2] += case["duration"] or 0
                  add()
                  table(["Grupo", "Testes", "Falhas", "Duração"], [(name, n, failed, seconds(total)) for name, (n, failed, total) in suites.items()])
                  add()
                  table(["Teste", "Resultado", "Duração", "Abertura → automação", "Maior pausa"], [
                      (f"{case['suite']}.{case['test']}", case["result"] or "sem resultado", seconds(case["duration"]), launch_text(metrics), pause_text(metrics))
                      for case, metrics in measured
                  ])
              failures(log)

          def infrastructure():
              # Messages that point to the environment rather than to the app; finding none is not proof.
              markers = ("unable to boot", "failed to boot", "coresimulatorservice", "early unexpected exit",
                         "test runner exited", "never began executing", "failed to initialize for ui testing",
                         "lost connection", "timed out while launching", "unable to find a destination",
                         "crashed", "simulator device failed", "unable to lookup in current state")
              found = []
              for path in ("build/build.log", "build/unit-test.log", "build/ui-test.log", "build/build-release.log"):
                  for line in (read_text(path) or "").splitlines():
                      if any(marker in line.lower() for marker in markers):
                          entry = f"{os.path.basename(path)}: {line.strip()[:300]}"
                          if entry not in found:
                              found.append(entry)
              if not found:
                  add("Nenhuma marca conhecida de infraestrutura encontrada nos logs (isso não prova que não houve problema de ambiente).")
                  return
              for entry in found[:30]:
                  add(f"- `{entry}`")
              if len(found) > 30:
                  add(f"- … mais {len(found) - 30} linhas.")

          def failure_attachments():
              # Text attachments of failed interface tests, from the exported results: the debug
              # descriptions (only the query that failed) and the hierarchy of the app's screen when
              # the test ended, which IronFlowUITestCase attaches (what was on screen, which is what a
              # failure that cannot be reproduced locally needs).
              manifest = read_json("build/screenshots/manifest.json")
              if not isinstance(manifest, list):
                  add(f"{UNAVAILABLE} (nenhum anexo exportado)")
                  return
              listed = printed = 0
              for test in manifest:
                  identifier = test.get("testIdentifier") or test.get("testIdentifierURL") or "?"
                  for attachment in test.get("attachments", []):
                      name = attachment.get("suggestedHumanReadableName") or ""
                      lowered = name.lower()
                      hierarchy = "ui hierarchy" in lowered
                      if not (attachment.get("isAssociatedWithFailure") or "debug description" in lowered or hierarchy):
                          continue
                      exported = attachment.get("exportedFileName") or ""
                      add(f"- `{identifier}`: `{exported}`")
                      listed += 1
                      if exported.lower().endswith((".txt", ".log", ".json")) and printed < 1000:
                          text = [line[:240] for line in (read_text(os.path.join("build/screenshots", exported)) or "").splitlines()[:150 if hierarchy else 60]]
                          add()
                          add("```")
                          lines.extend(text)
                          add("```")
                          printed += len(text)
              if listed == 0:
                  add("Nenhum anexo associado a falhas.")

          def measurements():
              # Values the interface tests measured and kept as attachments named "Medição: ...", printed
              # even when the test passes (the brightness of each screen, of a sheet and of the keyboard).
              manifest = read_json("build/screenshots/manifest.json")
              if not isinstance(manifest, list):
                  add(f"{UNAVAILABLE} (nenhum anexo exportado)")
                  return
              rows = []
              for test in manifest:
                  identifier = test.get("testIdentifier") or test.get("testIdentifierURL") or "?"
                  for attachment in test.get("attachments", []):
                      name = attachment.get("suggestedHumanReadableName") or ""
                      if not name.startswith("Medição"):
                          continue
                      exported = attachment.get("exportedFileName") or ""
                      value = (read_text(os.path.join("build/screenshots", exported)) or UNAVAILABLE).strip()
                      rows.append((identifier, re.sub(r"_\d+_[0-9A-Fa-f-]{36}", "", name), value))
              if not rows:
                  add("Nenhuma medição registrada.")
                  return
              table(["Teste", "Medição", "Valor"], rows)

          def builds():
              # xcodebuild -showBuildTimingSummary: the time spent in each kind of task. Tasks run in
              # parallel, so their times can add up to more than the duration of the step.
              for label, path, key in (("Compilação para testes", "build/build.log", "build_for_testing"),
                                       ("Compilação Release", "build/build-release.log", "build_release")):
                  add(f"**{label}**: duração {seconds(duration(key))}, carga de 1 min {load(key)}")
                  add()
                  log = read_text(path)
                  if log is None:
                      add(f"{UNAVAILABLE} (sem log: a etapa não foi executada)")
                      add()
                      continue
                  log_lines = log.splitlines()
                  starts = [i for i, line in enumerate(log_lines) if line.strip() == "Build Timing Summary"]
                  if not starts:
                      add(f"{UNAVAILABLE} (o resumo de tempos não aparece no log)")
                      add()
                      continue
                  summary = []
                  for line in log_lines[starts[-1] + 1:]:
                      if line.strip():
                          summary.append(line.strip())
                      if line.startswith("** ") or len(summary) >= 40:
                          break
                  add("```")
                  lines.extend(summary)
                  add("```")
                  add()

          def limitations():
              add("- A abertura do app e a conexão da automação aparecem juntas no log (de “Launch” a “Setting up automation session”).")
              add("- A carga da máquina é a média de 1 minuto no início e no fim de cada etapa, não uma medição contínua.")
              add("- Screenshots e resultados completos ficam nos artefatos test-results e screenshots; o registro do simulador fica em build-logs quando algum teste falha.")
              add("- Os tempos das etapas vêm do relógio do runner, com precisão de 1 s.")

          add("## Diagnóstico do CI")
          section("Ambiente", environment)
          section("Etapas", steps)
          section("Compilações", builds)
          section("Simulador", boot)
          section("Testes de unidade", unit_tests)
          section("Testes de interface", ui_tests)
          section("Marcas de infraestrutura", infrastructure)
          section("Medições dos testes", measurements)
          section("Anexos de falhas", failure_attachments)
          section("Limitações", limitations)

          report = "\n".join(lines) + "\n"
          print(report)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              try:
                  with open(summary, "a") as f:
                      f.write(report)
              except OSError as error:
                  print(f"Não foi possível escrever o resumo da execução: {error}")
          PY

  # Publishes the screenshots of a green push run to the "ci-screenshots" branch,
  # so they can be viewed in the GitHub app without downloading artifacts.
  # That branch holds only images and is overwritten on every publish; no code lives there.
  publish-screenshots:
    name: Publish screenshots to ci-screenshots branch
    needs: build-and-test
    if: github.event_name == 'push' && needs.build-and-test.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots
          path: screenshots

      - name: Publish to ci-screenshots branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pngs=(screenshots/*.png)
          if [ "${#pngs[@]}" -eq 0 ]; then
            echo "::error::No screenshots found to publish."
            exit 1
          fi

          mkdir publish
          # Short names: "1-tab.home_0_<id>.root.png" becomes "1-home.png".
          for file in "${pngs[@]}"; do
            name="$(basename "$file")"
            short="$(echo "$name" | sed -E 's/^([0-9]+)-tab\.([a-z]+)_.*\.png$/\1-\2.png/')"
            if [ -e "publish/$short" ]; then
              short="$name"
            fi
            cp "$file" "publish/$short"
          done

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "# Screenshots do CI"
            echo
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Execução: $run_url"
            echo "- Data (UTC): $(date -u '+%Y-%m-%d %H:%M')"
            for image in $(cd publish && ls *.png | sort); do
              echo
              echo "## ${image%.png}"
              echo
              echo "![${image%.png}]($image)"
            done
          } > publish/README.md

          cd publish
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA:0:7} ($GITHUB_REF_NAME)"
          git push --force -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
          echo "Published $(ls *.png | wc -l) screenshots to branch ci-screenshots."
