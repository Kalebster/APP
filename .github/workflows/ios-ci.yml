name: iOS CI

# Every push to any branch runs the full CI, so a branch has a result from its first push; only
# ci-screenshots (images published by this workflow, no code) is left out. There is no pull_request
# trigger: a pull request shows the result of the push run of its head commit, and main runs again
# on every merge. Started by hand, it is the full CI too, unless tests are typed: then it is the short
# diagnostic run (see the job ui-tests), which never counts as the green CI of a stage.
on:
  push:
    branches-ignore:
      - ci-screenshots
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      testes:
        description: "Rodada curta, só para diagnóstico: os testes de interface a rodar (Classe/testeNome ou Classe, separados por espaço ou vírgula, até 20). Vazio roda o CI completo."
        required: false
        type: string
        default: ""
      repeticoes:
        description: "Rodada curta: quantas vezes rodar cada teste, de 1 a 10. Vazio vale 1."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # The short diagnostic run has a group of its own: it never cancels a full run, nor is cancelled by one.
  group: ios-ci-${{ github.ref }}${{ inputs.testes && '-diagnostico' || '' }}
  # Never cancel runs on main, so every commit there gets a result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Xcode and simulator are pinned on purpose, and every macOS job uses these same values (ci/select-xcode.sh,
# ci/build-for-testing.sh and ci/boot-simulator.sh). Updating them must be a deliberate, reviewed change:
# edit these values, never rely on runner defaults.
env:
  XCODE_PATH: /Applications/Xcode_26.6.app
  XCODE_VERSION: "26.6"
  XCODE_BUILD: 17F113
  SIMULATOR_DESTINATION: "platform=iOS Simulator,arch=arm64,name=iPhone 17,OS=26.5"
  DERIVED_DATA_PATH: build/DerivedData
  # Interface tests (screenshots are exported from this bundle) and unit tests have separate results.
  RESULT_BUNDLE_PATH: build/TestResults.xcresult
  UNIT_RESULT_BUNDLE_PATH: build/UnitTestResults.xcresult

jobs:
  # The interface tests, split in 3 parts that run at the same time, each on its own machine.
  # ci/ui-test-shards.json puts every test in exactly one part, balanced by the time each test took in
  # recent runs. Every machine builds for itself: the build (about 2 minutes) is shorter than booting the
  # simulator (about 3), and machines sharing one build could only start after it, plus its upload and
  # download. One machine with all 78 tests took 50 to 60 minutes; a part takes about 16 plus about 8 of
  # build, boot and results. Started by hand with tests typed, this job is instead the short diagnostic
  # run: one machine runs only those tests, and the other jobs do not run.
  ui-tests:
    name: ${{ matrix.part == 'diagnostico' && 'Diagnóstico — rodada curta (não vale como CI da etapa)' || format('UI tests {0}/3 (Xcode 26.6, iPhone 17, iOS 26.5)', matrix.part) }}
    runs-on: macos-26
    # A part took 23 to 28 minutes in its first runs. 60 leave room for a slow machine (about 1.5 times
    # slower has been seen) plus the 5 minutes of the simulator log when a test fails, so the results are
    # still uploaded. The short run is limited to about 60 minutes of tests by ci/ui_tests.py.
    timeout-minutes: ${{ matrix.part == 'diagnostico' && 90 || 60 }}
    strategy:
      # A part that fails does not stop the others, so every test still gets a result.
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.testes && '["diagnostico"]' || '["1", "2", "3"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tests of this part or, in the short run, the tests and repetitions typed when it was started.
      # Those come in environment variables and ci/ui_tests.py validates them (names of interface tests
      # only, repetitions from 1 to 10) before anything is built; they never go into a command as text.
      - name: Choose tests
        env:
          PART: ${{ matrix.part }}
          TESTES: ${{ inputs.testes }}
          REPETICOES: ${{ inputs.repeticoes }}
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics
          python3 ci/ui_tests.py arguments --part "$PART" --output build/diagnostics/test-arguments.txt

      - name: Select and verify pinned Xcode
        run: ci/select-xcode.sh

      - name: Show environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcrun simctl list devices available


      - name: Validate project
        run: |
          set -euo pipefail
          xcodebuild -list -project IronFlow.xcodeproj
      - name: Build for testing
        id: build_for_testing
        run: ci/build-for-testing.sh

      - name: Boot simulator
        id: simulator
        run: ci/boot-simulator.sh

      # The app is opened and closed once before the tests, so the first test of each part does not pay
      # alone for the first launch on a simulator that has just booted. With one machine for every test,
      # the unit tests (which run inside the app) did that before the interface tests; on main at
      # 711820f (run 42393544305) the first test of two parts, on a cold simulator, failed on timing.
      # Opened with -ui-testing, as the tests open it, so it uses their store and not the app's own.
      - name: Warm up simulator
        id: warmup
        run: |
          set -euo pipefail
          source ci/record-step.sh simulator_warmup || true
          app="$DERIVED_DATA_PATH/Build/Products/Debug-iphonesimulator/IronFlow.app"
          bundle_id="$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")"
          xcrun simctl install "$SIMULATOR_UDID" "$app"
          xcrun simctl launch "$SIMULATOR_UDID" "$bundle_id" -ui-testing
          xcrun simctl terminate "$SIMULATOR_UDID" "$bundle_id"

      # Each line of test-arguments.txt is one xcodebuild argument (-only-testing:IronFlowUITests/...).
      - name: Run UI tests
        id: ui_tests
        run: |
          set -euo pipefail
          source ci/record-step.sh ui_tests || true
          test_arguments=()
          while IFS= read -r argument; do
            test_arguments+=("$argument")
          done < build/diagnostics/test-arguments.txt
          xcodebuild test-without-building \
            -project IronFlow.xcodeproj \
            -scheme IronFlow \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            "${test_arguments[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/ui-test.log

      # Which tests ran here, with result and time, for the job that checks every part.
      - name: List executed tests
        if: ${{ !cancelled() }}
        env:
          PART: ${{ matrix.part }}
        run: python3 ci/ui_tests.py executed build/ui-test.log --part "$PART" --output build/diagnostics/ui-tests-executed.json

      # When tests fail, the simulator's system log of the run is kept with the build logs.
      # Bounded so this optional diagnostic cannot use up the job's time; it never replaces the test failure.
      - name: Collect simulator log
        if: ${{ !cancelled() && steps.ui_tests.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 45m --style compact \
            > build/diagnostics/simulator-system.log 2>&1
          ls -la build/diagnostics/simulator-system.log

      - name: Summarize build warnings
        if: always()
        run: ci/build-warnings.sh

      - name: Export screenshots
        if: always()
        run: |
          set -euo pipefail
          if [ ! -d "$RESULT_BUNDLE_PATH" ]; then
            echo "No result bundle found; skipping screenshot export."
            exit 0
          fi
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments \
            --path "$RESULT_BUNDLE_PATH" \
            --output-path build/screenshots
          # Give exported files their readable attachment names when the manifest provides them.
          # Name clashes get a numeric suffix (never overwrite) and the manifest is kept in sync.
          python3 - <<'PY'
          import json, os
          # Characters upload-artifact rejects in file names (failure attachments are named like
          # 'Debug description for `"Push" NavigationBar`'), plus the path separators.
          invalid = '":<>|*?\r\n/\\'
          folder = "build/screenshots"
          manifest_path = os.path.join(folder, "manifest.json")
          if not os.path.exists(manifest_path):
              print("No manifest.json; keeping exported file names.")
              raise SystemExit(0)
          with open(manifest_path) as f:
              manifest = json.load(f)
          for test in manifest:
              for attachment in test.get("attachments", []):
                  exported = attachment.get("exportedFileName")
                  readable = attachment.get("suggestedHumanReadableName")
                  if not exported or not readable:
                      continue
                  readable = "".join("_" if c in invalid else c for c in readable)
                  source = os.path.join(folder, exported)
                  if not os.path.exists(source):
                      print(f"Missing exported file: {exported}")
                      continue
                  # Suggested names may lack the file extension (e.g. "1-tab.home_0_<id>.root").
                  extension = os.path.splitext(exported)[1]
                  if extension and not readable.endswith(extension):
                      readable += extension
                  stem, ext = os.path.splitext(readable)
                  target, n = readable, 2
                  while os.path.exists(os.path.join(folder, target)):
                      target, n = f"{stem}-{n}{ext}", n + 1
                  os.rename(source, os.path.join(folder, target))
                  attachment["exportedFileName"] = target
          with open(manifest_path, "w") as f:
              json.dump(manifest, f, indent=2)
          PY
          ls -la build/screenshots

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs-ui-${{ matrix.part }}
          path: |
            build/*.log
            build/diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-ui-${{ matrix.part }}
          path: |
            ${{ env.RESULT_BUNDLE_PATH }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-ui-${{ matrix.part }}
          path: |
            build/screenshots
          if-no-files-found: warn
          retention-days: 7

      - name: Upload executed tests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-tests-executed-${{ matrix.part }}
          path: |
            build/diagnostics/ui-tests-executed.json
          if-no-files-found: warn
          retention-days: 7

      # Diagnostics of this machine (ci/ci_diagnostics.py), printed last so they close the log, and added
      # to the run summary. They never change the result of the job.
      - name: Report CI diagnostics
        if: always()
        continue-on-error: true
        env:
          DIAGNOSTICS_TITLE: ${{ matrix.part == 'diagnostico' && 'rodada curta de diagnóstico' || format('testes de interface, parte {0} de 3', matrix.part) }}
          BUILD_OUTCOME: ${{ steps.build_for_testing.outcome }}
          SIMULATOR_OUTCOME: ${{ steps.simulator.outcome }}
          WARMUP_OUTCOME: ${{ steps.warmup.outcome }}
          UI_OUTCOME: ${{ steps.ui_tests.outcome }}
        run: python3 ci/ci_diagnostics.py

  # The unit tests and the Release build, on a machine of their own while the interface tests run. It
  # also lists the interface tests of the built bundle and fails if one is in no part of
  # ci/ui-test-shards.json, or in two, or listed there without existing.
  # In the short run this job is skipped; its name changes there, so the skipped check never stands for
  # the result of the full run on the same commit.
  unit-and-release:
    name: ${{ inputs.testes && 'Unit tests and Release (não roda na rodada curta)' || 'Unit tests and Release (Xcode 26.6, iPhone 17, iOS 26.5)' }}
    if: ${{ !inputs.testes }}
    runs-on: macos-26
    # Green runs of these steps took 8 to 14 minutes on one machine.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select and verify pinned Xcode
        run: ci/select-xcode.sh

      - name: Show environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcrun simctl list devices available


      - name: Validate project
        run: |
          set -euo pipefail
          xcodebuild -list -project IronFlow.xcodeproj
      - name: Build for testing
        id: build_for_testing
        run: ci/build-for-testing.sh

      - name: Boot simulator
        id: simulator
        run: ci/boot-simulator.sh

      - name: List interface tests
        id: ui_test_list
        run: |
          set -euo pipefail
          source ci/record-step.sh ui_test_list || true
          xcodebuild test-without-building \
            -project IronFlow.xcodeproj \
            -scheme IronFlow \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -only-testing:IronFlowUITests \
            -enumerate-tests \
            -test-enumeration-style flat \
            -test-enumeration-format json \
            -test-enumeration-output-path build/diagnostics/ui-tests-enumeration.json \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/ui-test-list.log
          python3 ci/ui_tests.py enumerated build/diagnostics/ui-tests-enumeration.json \
            --output build/diagnostics/ui-tests-enumerated.json

      # Every test target of the scheme except the interface tests. Runs even when the list of interface
      # tests fails, so the results of both are always reported.
      - name: Run unit tests
        id: unit_tests
        if: ${{ !cancelled() && steps.build_for_testing.outcome == 'success' && steps.simulator.outcome == 'success' }}
        run: |
          set -euo pipefail
          source ci/record-step.sh unit_tests || true
          xcodebuild test-without-building \
            -project IronFlow.xcodeproj \
            -scheme IronFlow \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$UNIT_RESULT_BUNDLE_PATH" \
            -skip-testing:IronFlowUITests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/unit-test.log

      # When tests fail, the simulator's system log of the run is kept with the build logs.
      # Bounded so this optional diagnostic cannot use up the job's time; it never replaces the test failure.
      - name: Collect simulator log
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 45m --style compact \
            > build/diagnostics/simulator-system.log 2>&1
          ls -la build/diagnostics/simulator-system.log

      # Release is compiled, not tested again: the tests above cover the behavior, and this proves the
      # optimized build without the Debug-only test hooks still compiles, for the iPhone SDK the App
      # Store build uses (one architecture, no signing). Runs even when tests fail, so both are reported.
      - name: Build Release
        id: build_release
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          source ci/record-step.sh build_release || true
          xcodebuild build \
            -project IronFlow.xcodeproj \
            -scheme IronFlow \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/build-release.log

      # The app is dark only, and the Release build must not carry the Debug-only test hooks. Neither is
      # covered by the tests (they run the Debug build), so the Release app is checked here: its
      # Info.plist must say Dark, and the text of its executable must not hold what only the hooks
      # contain. The hook arguments themselves (-ui-testing, -ui-seed) are too short to be found as text
      # (Swift keeps strings of up to 15 bytes inside the code), so longer text that exists only with
      # them is searched instead, and the same text must be found in the Debug app, or the search would
      # prove nothing.
      - name: Verify Release build
        id: verify_release
        if: ${{ !cancelled() && steps.build_release.outcome == 'success' }}
        run: |
          set -euo pipefail
          debug_app="$DERIVED_DATA_PATH/Build/Products/Debug-iphonesimulator/IronFlow.app"
          release_app="$DERIVED_DATA_PATH/Build/Products/Release-iphoneos/IronFlow.app"
          for app in "$debug_app" "$release_app"; do
            if [ ! -d "$app" ]; then
              echo "::error::App not found at $app"
              exit 1
            fi
          done

          style="$(plutil -extract UIUserInterfaceStyle raw "$release_app/Info.plist")"
          echo "UIUserInterfaceStyle in the Release Info.plist: $style"
          if [ "$style" != "Dark" ]; then
            echo "::error::Expected UIUserInterfaceStyle Dark in the Release Info.plist, found: $style"
            exit 1
          fi

          # All the text of every executable in an app (the Debug app keeps its code in a .dylib too).
          dump_text() {
            : > "$2"
            for file in "$1"/*; do
              if [ -f "$file" ]; then
                case "$(file -b "$file")" in
                  *Mach-O*) strings -a "$file" >> "$2" ;;
                esac
              fi
            done
          }
          dump_text "$debug_app" build/diagnostics/debug-app-text.txt
          dump_text "$release_app" build/diagnostics/release-app-text.txt

          failed=0
          {
            echo "## Verificação do Release"
            echo
            echo "- UIUserInterfaceStyle no Info.plist do Release: \`$style\`"
            echo
            echo "| Texto que só existe com os ganchos de teste | No Debug (controle) | No Release |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for marker in "-simulate-persistence-failure" "com.ironflow.app.ui-testing" "UI test seed failed" "UITestSeed"; do
            in_debug=não
            in_release=não
            if grep -qF -- "$marker" build/diagnostics/debug-app-text.txt; then in_debug=sim; fi
            if grep -qF -- "$marker" build/diagnostics/release-app-text.txt; then in_release=sim; fi
            echo "| \`$marker\` | $in_debug | $in_release |" >> "$GITHUB_STEP_SUMMARY"
            echo "$marker: Debug=$in_debug Release=$in_release"
            if [ "$in_release" = sim ]; then
              echo "::error::Test hook text '$marker' found in the Release app"
              failed=1
            fi
            if [ "$in_debug" = não ]; then
              echo "::warning::'$marker' was not found in the Debug app, so its absence from Release proves nothing"
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "The Release app is dark only and holds none of the test hooks."

          # The size of the Release app: the bundle as built, and zipped, close to what is downloaded (the
          # App Store also thins it for each device). The Inter files are counted on their own.
          app_kb="$(du -sk "$release_app" | cut -f1)"
          # Outside build/, so the logs artifact does not carry it.
          ditto -c -k --keepParent "$release_app" "$RUNNER_TEMP/release-app.zip"
          zip_kb="$(du -sk "$RUNNER_TEMP/release-app.zip" | cut -f1)"
          fonts_kb=0
          for font in "$release_app"/Inter-*.ttf; do
            if [ -f "$font" ]; then
              fonts_kb=$((fonts_kb + $(du -k "$font" | cut -f1)))
            fi
          done
          echo "Release app size: ${app_kb} KB as built, ${zip_kb} KB zipped; Inter fonts: ${fonts_kb} KB"
          {
            echo
            echo "- Tamanho do app Release: ${app_kb} KB como compilado, ${zip_kb} KB compactado; as fontes Inter ocupam ${fonts_kb} KB"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Summarize build warnings
        if: always()
        run: ci/build-warnings.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs-unit
          path: |
            build/*.log
            build/diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-unit
          path: |
            ${{ env.UNIT_RESULT_BUNDLE_PATH }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload list of interface tests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-tests-enumerated
          path: |
            build/diagnostics/ui-tests-enumerated.json
          if-no-files-found: warn
          retention-days: 7

      # Diagnostics of this machine (ci/ci_diagnostics.py), printed last so they close the log, and added
      # to the run summary. They never change the result of the job.
      - name: Report CI diagnostics
        if: always()
        continue-on-error: true
        env:
          DIAGNOSTICS_TITLE: testes de unidade e Release
          BUILD_OUTCOME: ${{ steps.build_for_testing.outcome }}
          SIMULATOR_OUTCOME: ${{ steps.simulator.outcome }}
          UI_TEST_LIST_OUTCOME: ${{ steps.ui_test_list.outcome }}
          UNIT_OUTCOME: ${{ steps.unit_tests.outcome }}
          RELEASE_OUTCOME: ${{ steps.build_release.outcome }}
        run: python3 ci/ci_diagnostics.py

  # Every interface test of the built bundle must have run exactly once, in its own part, and passed. A
  # test in no part or in two, a part that did not finish and a test that ran twice all fail here. Runs
  # even when a part failed, to say which tests ran. Like unit-and-release, its name changes in the short
  # run, where it is skipped.
  ui-tests-complete:
    name: ${{ inputs.testes && 'Interface tests complete (não roda na rodada curta)' || 'Interface tests complete' }}
    needs: [ui-tests, unit-and-release]
    if: ${{ !cancelled() && !inputs.testes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A missing list is reported by the check below, with the part it belongs to.
      - name: Download executed tests
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ui-tests-executed-*
          path: executed

      - name: Download list of interface tests
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-tests-enumerated
          path: enumerated

      - name: Check every interface test ran once and passed
        run: python3 ci/ui_tests.py complete --executed executed --enumerated enumerated/ui-tests-enumerated.json

  # Publishes the screenshots of a green push run to the "ci-screenshots" branch,
  # so they can be viewed in the GitHub app without downloading artifacts.
  # That branch holds only images and is overwritten on every publish; no code lives there.
  publish-screenshots:
    name: Publish screenshots to ci-screenshots branch
    needs: [ui-tests, unit-and-release, ui-tests-complete]
    if: github.event_name == 'push' && needs.ui-tests.result == 'success' && needs.unit-and-release.result == 'success' && needs.ui-tests-complete.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: screenshots-ui-*
          path: screenshot-parts

      # The screenshots of every part in one folder, with the names they were exported with. Two parts
      # with the same name would mean a test ran twice, so that fails instead of keeping one.
      - name: Join the screenshots of every part
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir screenshots
          for part in screenshot-parts/*/; do
            pngs=("$part"*.png)
            echo "$(basename "$part"): ${#pngs[@]} screenshots"
            for file in "${pngs[@]}"; do
              name="$(basename "$file")"
              if [ -e "screenshots/$name" ]; then
                echo "::error::Screenshot $name came from more than one part."
                exit 1
              fi
              cp "$file" "screenshots/$name"
            done
          done

      - name: Publish to ci-screenshots branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pngs=(screenshots/*.png)
          if [ "${#pngs[@]}" -eq 0 ]; then
            echo "::error::No screenshots found to publish."
            exit 1
          fi

          mkdir publish
          # Short names: "1-tab.home_0_<id>.root.png" becomes "1-home.png".
          for file in "${pngs[@]}"; do
            name="$(basename "$file")"
            short="$(echo "$name" | sed -E 's/^([0-9]+)-tab\.([a-z]+)_.*\.png$/\1-\2.png/')"
            if [ -e "publish/$short" ]; then
              short="$name"
            fi
            cp "$file" "publish/$short"
          done

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "# Screenshots do CI"
            echo
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Execução: $run_url"
            echo "- Data (UTC): $(date -u '+%Y-%m-%d %H:%M')"
            for image in $(cd publish && ls *.png | sort); do
              echo
              echo "## ${image%.png}"
              echo
              echo "![${image%.png}]($image)"
            done
          } > publish/README.md

          cd publish
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA:0:7} ($GITHUB_REF_NAME)"
          git push --force -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
          echo "Published $(ls *.png | wc -l) screenshots to branch ci-screenshots."
