name: Referências do protótipo

# Started by hand only. Opens the approved prototype (design/prototipo.html) in the macOS WebKit, the
# engine of Safari, where the system font is the real SF Pro, and saves one image for each CI screenshot
# that has an equivalent in the prototype (ci/prototype-references.json): the size of the screenshots
# (iPhone 17, 402 points wide at scale 3), with the prototype starting at the end of the top safe area.
# The images stay with the run and go to the prototipo/ folder of the ci-prototipo branch, which holds
# only these images and is replaced on every run, as ci-screenshots is. The CI of the stages (ios-ci.yml)
# does not run or change here.
on:
  workflow_dispatch:
  # TEMPORÁRIO, só nesta etapa: um workflow que ainda não está no main não pode ser iniciado à mão.
  # Sai antes do fim da etapa.
  push:
    branches:
      - visual-novo
    paths:
      - design/prototipo.html
      - ci/prototype_references.swift
      - ci/prototype-references.json
      - .github/workflows/prototype-references.yml

permissions:
  contents: read

concurrency:
  group: prototype-references
  cancel-in-progress: false

# The same pinned Xcode as the CI (ci/select-xcode.sh): the renderer is compiled with it.
env:
  XCODE_PATH: /Applications/Xcode_26.6.app
  XCODE_VERSION: "26.6"
  XCODE_BUILD: 17F113

jobs:
  render:
    name: Referências (WebKit do macOS, SF Pro)
    runs-on: macos-26
    # About 70 images of a few seconds each, one of them waiting 16 s for a rest to end.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select and verify pinned Xcode
        run: ci/select-xcode.sh

      - name: Show system
        run: |
          set -euo pipefail
          sw_vers
          system_profiler SPDisplaysDataType | sed -n '1,30p' || true

      # No dependency: the renderer uses only macOS (AppKit and WebKit).
      - name: Build renderer
        run: |
          set -euo pipefail
          mkdir -p build
          xcrun swiftc -O -parse-as-library ci/prototype_references.swift -o build/prototype-references

      - name: Render references
        run: |
          set -euo pipefail
          build/prototype-references design/prototipo.html ci/prototype-references.json build/prototipo
          ls -la build/prototipo

      - name: Upload references
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: referencias-prototipo
          path: build/prototipo/*.png
          if-no-files-found: error
          retention-days: 30

  # The images in the prototipo/ folder of the ci-prototipo branch, to see them in the GitHub app. That
  # branch holds only these images, and each run replaces it, so its history does not grow.
  publish:
    name: Publicar no branch ci-prototipo
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download references
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: referencias-prototipo
          path: publish/prototipo

      - name: Publish to ci-prototipo branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pngs=(publish/prototipo/*.png)
          if [ "${#pngs[@]}" -eq 0 ]; then
            echo "::error::No references to publish."
            exit 1
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "# Referências do protótipo"
            echo
            echo "O protótipo design/prototipo.html no WebKit do macOS, com a SF Pro, no tamanho dos screenshots do CI."
            echo
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Execução: $run_url"
            echo "- Data (UTC): $(date -u '+%Y-%m-%d %H:%M')"
            for image in $(cd publish/prototipo && ls *.png | sort -n); do
              echo
              echo "## ${image%.png}"
              echo
              echo "![${image%.png}](prototipo/$image)"
            done
          } > publish/README.md

          cd publish
          git init -q -b ci-prototipo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Referências do protótipo de ${GITHUB_SHA:0:7} ($GITHUB_REF_NAME)"
          git push --force -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-prototipo
          echo "Published ${#pngs[@]} references to branch ci-prototipo."
